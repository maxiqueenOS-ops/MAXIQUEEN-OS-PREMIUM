<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>🧠 Juego Mental Interactivo</title>
<style>
body{
  background:#0b1220;
  color:#fff;
  font-family:sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.game{
  background:#111827;
  padding:20px;
  border-radius:15px;
  width:350px;
  text-align:center;
}

button{
  margin:5px;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#facc15;
  cursor:pointer;
}

button:hover{
  background:#fde047;
}

#text{
  margin-bottom:15px;
}
</style>
</head>

<body>

<div class="game">
  <h2>🧠 RESET MENTAL</h2>
  <div id="text">¿Cómo te sientes ahora mismo?</div>
  <div id="options"></div>
</div>

<script>

const text = document.getElementById("text");
const options = document.getElementById("options");

function startGame(){
  showOptions([
    {text:"😵 Estresado", action: stress},
    {text:"😞 Cansado", action: tired},
    {text:"😤 Molesto", action: angry},
    {text:"😶 Perdido", action: lost}
  ]);
}

function showOptions(arr){
  options.innerHTML = "";
  arr.forEach(opt => {
    const btn = document.createElement("button");
    btn.innerText = opt.text;
    btn.onclick = opt.action;
    options.appendChild(btn);
  });
}

function stress(){
  text.innerText = "Respira conmigo: inhala 4s, exhala 6s. ¿Lo hiciste?";
  showOptions([
    {text:"Sí", action: calm1},
    {text:"No", action: stress}
  ]);
}

function calm1(){
  text.innerText = "Bien. Ahora dime, ¿qué te está saturando más?";
  showOptions([
    {text:"Trabajo / proyecto", action: solution1},
    {text:"Personas / peleas", action: solution2}
  ]);
}

function tired(){
  text.innerText = "Tu mente está cansada. No necesitas resolver todo. ¿Quieres hacer algo pequeño?";
  showOptions([
    {text:"Sí", action: smallTask},
    {text:"No, descansar", action: rest}
  ]);
}

function angry(){
  text.innerText = "Cuando hay enojo, hay sobrecarga. ¿Quieres soltar o entender?";
  showOptions([
    {text:"Soltar", action: release},
    {text:"Entender", action: solution2}
  ]);
}

function lost(){
  text.innerText = "Estar perdido = demasiadas opciones. Vamos a simplificar. ¿Te ayudo?";
  showOptions([
    {text:"Sí", action: smallTask},
    {text:"No", action: rest}
  ]);
}

function solution1(){
  text.innerText = "Haz solo el 10% de tu tarea. No más.";
  showOptions([{text:"Continuar", action: end}]);
}

function solution2(){
  text.innerText = "No respondas desde cansancio. Da espacio.";
  showOptions([{text:"Continuar", action: end}]);
}

function smallTask(){
  text.innerText = "Elige algo mínimo: abrir archivo, ordenar idea o descansar.";
  showOptions([{text:"Hecho", action: end}]);
}

function rest(){
  text.innerText = "Descansa 10 minutos. Eso también es avanzar.";
  showOptions([{text:"Ok", action: end}]);
}

function release(){
  text.innerText = "Suelta: no necesitas reaccionar ahora.";
  showOptions([{text:"Continuar", action: end}]);
}

function end(){
  text.innerText = "🔥 Bien. Bajaste el caos. Eso ya es ganar.";
  showOptions([{text:"Reiniciar", action: startGame}]);
}

startGame();

</script>

</body>
</html>
